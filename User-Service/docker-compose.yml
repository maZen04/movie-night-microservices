version: "3.9"

services:
  user-service:
    build: .

    container_name: user-service

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    restart: unless-stopped